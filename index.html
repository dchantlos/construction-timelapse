<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- ============ CLEAN CAPTURE MODE (marketing screenshots) ============
         Append ?clean to the URL to hide floating UI (help / resources /
         assistant buttons) for pristine hero screenshots. The timeline dock,
         full 3D scene, and Esri attribution are kept. No effect otherwise.
         Also tags <html data-project> (?project=linear, else vertical — same
         rule as config.js) so the other project's UI never flashes in. -->
    <script>
      (function () {
        var q = new URLSearchParams(location.search);
        if (q.has("clean")) document.documentElement.classList.add("capture-clean");
        document.documentElement.dataset.project = q.get("project") === "linear" ? "linear" : "vertical";
      })();
    </script>
    <style>
      .capture-clean .welcome,
      .capture-clean .help-fab,
      .capture-clean .res-fab,
      .capture-clean .asst-fab { display: none !important; }
    </style>

    <title>Construction Timelapse · ArcGIS</title>

    <!-- ArcGIS dark base theme (we override most of it in styles.css) -->
    <template data-device="supported">
      <link rel="stylesheet" href="https://js.arcgis.com/5.1/esri/themes/dark/main.css" />
    </template>
    <link rel="stylesheet" href="./css/styles.css?v=83" />

    <!-- ESM import map: load @arcgis/core (and JSZip for BCF export) from CDNs -->
    <script type="importmap">
      {
        "imports": {
          "@arcgis/core/": "https://js.arcgis.com/5.1/@arcgis/core/",
          "jszip": "https://cdn.jsdelivr.net/npm/jszip@3.10.1/+esm"
        }
      }
    </script>
    <!-- Privacy-friendly page-visit analytics (GoatCounter) -->
    <script data-goatcounter="https://dchantlos.goatcounter.com/count"
            async src="//gc.zgo.at/count.js"></script>
  </head>

  <body data-help="index">
    <noscript>Open Construction Timelapse on a tablet or computer with JavaScript enabled.</noscript>
    <template data-device="supported">
    <!-- 3D scene mount point -->
    <div id="viewDiv"></div>

    <!-- Boot / loading veil -->
    <div id="boot" class="boot">
      <div class="boot__mark">
        <span class="boot__pulse" aria-hidden="true"></span>
        <img class="boot__logo" src="./assets/dev-logo.png" alt="Esri Developers" />
      </div>
      <div class="boot__text">Initializing Construction Twin<span class="boot__dots"></span></div>
    </div>

    <!-- ======================= WELCOME MODAL ======================= -->
    <!-- Parked: hidden by default, open it with ?welcome (see js/welcome.js). -->
    <div id="welcome" class="welcome" role="dialog" aria-modal="true" aria-labelledby="welcomeTitle" hidden>
      <div class="welcome__backdrop" data-welcome-close></div>
      <div class="welcome__panel glass" role="document">
        <span class="welcome__badge">Pre-Construction · BIM Validation</span>
        <h1 id="welcomeTitle" class="welcome__title">Welcome to the Construction Digital Twin</h1>
        <p class="welcome__made">Made with the <strong>ArcGIS Maps SDK for JavaScript</strong></p>
        <p class="welcome__desc">Validating the BIM model before we build — checking geolocation, 4D plan sequencing, and auditing the standards in an open buildingSMART IDS.</p>
        <button type="button" class="welcome__btn" data-welcome-close>Enter the digital twin →</button>
        <img class="welcome__esri" src="./assets/esri-logo.png" alt="Esri" width="140" height="81" />
      </div>
    </div>

    <!-- ======================= TOP BAR ======================= -->
    <header class="topbar glass">
      <a class="brand" href="https://developers.arcgis.com/" target="_blank" rel="noopener noreferrer" title="Develop with ArcGIS — Esri Developers">
        <span class="brand__logo-wrap">
          <img class="brand__logo" src="./assets/dev-logo.png" alt="Esri Developers" width="40" height="40" />
          <span class="brand__glow" aria-hidden="true"></span>
        </span>
        <span class="brand__text">
          <span class="brand__badge">Develop with <span class="brand__accent">ArcGIS</span></span>
          <span class="brand__title">Construction Timelapse</span>
        </span>
      </a>

      <div class="topbar__center">
        <!-- Project switch: reopens this page for the other project (project-switch.js) -->
        <nav class="project-switch" aria-label="Project type">
          <a class="project-switch__opt" data-project-link="vertical" href="./index.html">
            <svg class="project-switch__icon" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 21V5.5L12 3l7 2.5V21M3 21h18M10.5 21v-3h3v3"/><path d="M9 8h.01M12 8h.01M15 8h.01M9 11.5h.01M12 11.5h.01M15 11.5h.01M9 15h.01M12 15h.01M15 15h.01"/></svg>
            <span class="project-switch__text">
              <span class="project-switch__kind">Vertical</span>
              <span class="project-switch__name">Meridian Tower</span>
            </span>
          </a>
          <a class="project-switch__opt" data-project-link="linear" href="./index.html?project=linear">
            <svg class="project-switch__icon" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 8.5h20M2 12h20M6 12v8M12 12v8M18 12v8M4 20h4M10 20h4M16 20h4"/></svg>
            <span class="project-switch__text">
              <span class="project-switch__kind">Linear</span>
              <span class="project-switch__name">Marina Bay East</span>
            </span>
          </a>
        </nav>

        <nav class="topbar__nav" aria-label="View">
          <a class="tab-link" data-page-link="./progress.html" href="./progress.html" title="View the simulated construction progress vs. the planned schedule">
            <span class="tab-link__icon">◎</span>
            <span class="tab-link__label">View Simulated Construction Progress</span>
          </a>
        </nav>
      </div>

      <div class="topbar__status">
        <span id="liveLabel">Planned Construction Sequencing</span>
      </div>
    </header>

    <!-- ======================= LEFT DASHBOARD ======================= -->
    <aside class="dashboard glass">
      <div class="dashboard__head dashboard__head--stack">
        <span class="dashboard__sub" id="dashDate">—</span>
      </div>

      <!-- Progress ring -->
      <section class="ring-card">
        <div class="ring">
          <svg viewBox="0 0 120 120">
            <circle class="ring__bg" cx="60" cy="60" r="52" />
            <circle class="ring__bar" id="ringBar" cx="60" cy="60" r="52" />
          </svg>
          <div class="ring__label">
            <span id="progressPct">0%</span>
            <small>Complete</small>
          </div>
        </div>
        <div class="ring-card__meta">
          <span class="kicker">Current Phase</span>
          <strong id="currentPhase">—</strong>
        </div>
      </section>

      <!-- Metric tiles -->
      <section class="metrics">
        <div class="metric">
          <span class="kicker">Active Layers</span>
          <strong id="activeLayerCount">0</strong>
        </div>
        <div class="metric">
          <span class="kicker">Elapsed</span>
          <strong id="elapsedDays">0d</strong>
        </div>
        <div class="metric">
          <span class="kicker">Remaining</span>
          <strong id="remainingDays">0d</strong>
        </div>
      </section>

      <!-- Active layer breakdown -->
      <section class="layers">
        <div class="layers__head">
          <span class="kicker">Construction Layers</span>
          <button id="resetLayers" class="btn-reset" type="button" title="Restore all layers">Reset</button>
        </div>
        <ul id="layerList" class="layer-list"></ul>
      </section>

      <!-- Model provenance: authored in IFC, streamed to the app as I3S -->
      <footer class="dashboard__foot">
        <span class="dashboard__foot-note">
          <span class="kicker">Source Model</span>
          <span class="dashboard__foot-sub">IFC · visualized as I3S</span>
        </span>
        <img class="dashboard__foot-logo" src="./assets/buildingsmart-ifc-white.png" alt="buildingSMART IFC" />
      </footer>
    </aside>

    <!-- ======================= LAYER VISIBILITY PANEL ======================= -->
    <aside class="layers-panel glass is-collapsed">
      <div class="layers-panel__head">
        <span class="kicker">Layers</span>
        <button id="layersToggle" class="panel-collapse" type="button" title="Expand layers" aria-label="Expand layers">+</button>
      </div>
      <ul id="visibilityList" class="toggle-list"></ul>
    </aside>

    <!-- ======================= CUSTOM RIGHT CONTROLS ======================= -->
    <div class="nav-stack glass">
      <button class="nav-btn" id="zoomIn" title="Zoom in" aria-label="Zoom in">+</button>
      <button class="nav-btn" id="zoomOut" title="Zoom out" aria-label="Zoom out">–</button>
      <button class="nav-btn" id="resetView" title="Reset view" aria-label="Reset view">⟳</button>
      <button class="nav-btn" id="sliceBtn" title="Slice through the model" aria-label="Slice tool" aria-pressed="false">◫</button>
      <button class="nav-btn" id="explodeBtn" title="Exploded view: lift the floors apart" aria-label="Exploded view" aria-pressed="false">⇕</button>
      <button class="nav-btn vertical-only" id="auditBtn" title="Audit the model against the IDS" aria-label="IDS model audit" aria-pressed="false">☑</button>
      <button class="nav-btn linear-only" id="basemapBtn" title="Photorealistic 3D basemap (Google, ArcGIS sign-in required)" aria-label="Photorealistic 3D basemap" aria-pressed="false">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2.5"/><circle cx="9" cy="9.5" r="1.6"/><path d="M3.5 18l5.5-5.5 4 4 2.5-2.5 5 5"/></svg>
      </button>
    </div>

    <!-- ======================= SLICE TOOL PANEL ======================= -->
    <aside id="slicePanel" class="slice-panel glass" aria-label="Slice tool" aria-hidden="true">
      <div class="slice-panel__head">
        <span class="kicker">Slice Tool</span>
        <button id="sliceClose" class="panel-collapse" type="button" aria-label="Close slice tool">✕</button>
      </div>
      <p class="slice-panel__hint">Click the model to drop a cut plane, then drag or tilt its handles to slice through the <span data-noun>building</span>.</p>
      <div id="sliceContainer" class="slice-panel__widget"></div>
    </aside>

    <!-- ======================= IDS MODEL AUDIT PANEL ======================= -->
    <aside id="auditPanel" class="audit-panel glass vertical-only" aria-label="IDS model audit" aria-hidden="true">
      <div class="audit-panel__head" title="Drag to move">
        <span class="audit-panel__handle">
          <span class="audit-panel__grip" aria-hidden="true">⠿</span>
          <span class="kicker">Model Audit</span>
        </span>
        <span class="audit-panel__right">
          <span class="audit-standards">
            <img class="audit-standards__logo" src="./assets/buildingsmart-ids-white.png" alt="buildingSMART IDS" />
            <span class="audit-standards__sep" aria-hidden="true"></span>
            <img class="audit-standards__logo" src="./assets/buildingsmart-bcf-white.png" alt="buildingSMART BCF" />
          </span>
          <button id="auditClose" class="panel-collapse" type="button" aria-label="Close IDS audit">✕</button>
        </span>
      </div>
      <div id="auditBody" class="audit-body"></div>
    </aside>

    <!-- ======================= BOTTOM PLAYBACK + SCRUBBER ======================= -->
    <footer class="dock glass">
      <button class="cine-btn" id="cinematicBtn" title="Play / pause construction timeline">
        <span class="cine-btn__icon" id="cineIcon">▶</span>
        <span class="cine-btn__label" id="cineLabel">Play</span>
      </button>

      <div class="scrub">
        <span class="scrub__date" id="timeDisplay">—</span>
        <input
          type="range"
          id="scrubSlider"
          class="scrub__range"
          min="0"
          max="100"
          step="1"
          value="0"
          aria-label="Construction timeline scrubber"
        />
      </div>
    </footer>

    <!-- TimeSlider runs purely as the time engine (drives time-aware layer
         filtering + dashboard); its UI is hidden via CSS. -->
    <div id="timeSlider" class="time-engine" aria-hidden="true"></div>

    <!-- ======================= CUSTOM HIT-TEST TOOLTIP ======================= -->
    <div id="tooltip" class="tooltip glass" role="dialog" aria-hidden="true">
      <span class="tooltip__tag" id="tipTag">Component</span>
      <h3 id="tipTitle">—</h3>
      <div class="tooltip__row">
        <span>Scheduled</span>
        <strong id="tipScheduled" class="tooltip__status">—</strong>
      </div>
      <div class="tooltip__row">
        <span>Phase</span>
        <strong id="tipPhase">—</strong>
      </div>
      <div class="tooltip__row linear-only">
        <span>Location</span>
        <strong id="tipLocation">—</strong>
      </div>
    </div>


    <!-- ======================= TIMELINE ASSISTANT ======================= -->
    <button
      id="assistantFab"
      class="asst-fab glass"
      type="button"
      title="Ask the timeline"
      aria-label="Open the timeline assistant"
    >
      <span class="asst-fab__icon">✨</span>
      <span class="asst-fab__label">Ask the timeline</span>
    </button>

    <section id="assistant" class="asst glass" aria-label="Timeline assistant">
      <header class="asst__head">
        <span class="asst__title">Ask the timeline</span>
        <button id="assistantClose" class="asst__close" type="button" aria-label="Close">✕</button>
      </header>
      <div id="assistantLog" class="asst__log" aria-live="polite"></div>
      <form id="assistantForm" class="asst__form">
        <input
          id="assistantInput"
          class="asst__input"
          type="text"
          autocomplete="off"
          placeholder="e.g. Nov 1 2025, 60%, halfway…"
          aria-label="Date or phrase"
        />
        <button id="assistantSend" class="asst__send" type="submit">Go</button>
      </form>
    </section>

    <script type="module" src="./js/project-switch.js?v=1"></script>
    <script type="module" src="./js/welcome.js?v=4"></script>
    <!-- Narrated Presentation Mode (tower narration — vertical project only) -->
    <script type="module">
      if (document.documentElement.dataset.project === "vertical") import("./js/presentation.js?v=26");
    </script>
    <script type="module" src="./js/app.js?v=58"></script>
    <script type="module" src="./js/help.js?v=10"></script>
    <script type="module" src="./js/resources.js?v=5"></script>
    </template>
    <script type="module">
      import { openAppPage } from "./js/phone-gate.mjs?v=1";
      openAppPage();
    </script>
  </body>
</html>
