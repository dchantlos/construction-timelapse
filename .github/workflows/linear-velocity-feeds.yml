name: Generate Linear Velocity CSVs

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - docs/velocity/linear/generate_feeds.mjs
      - docs/velocity/linear/feeds.test.mjs
      - .github/workflows/linear-velocity-feeds.yml

permissions:
  contents: write

concurrency:
  group: linear-velocity-feeds
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate feed data
        run: node --test docs/velocity/linear/feeds.test.mjs
      - name: Generate CSVs and schema manifest
        run: node docs/velocity/linear/generate_feeds.mjs
      - name: Publish generated data only
        shell: bash
        run: |
          git add docs/velocity/linear/*.csv docs/velocity/linear/feed-manifest.json
          if git diff --cached --quiet; then
            echo "Generated datasets already match."
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Publish roadway construction Velocity CSV feeds'
          git push origin HEAD:main
