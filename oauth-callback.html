<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Signing in…</title>
  </head>
  <body>
    <!--
      ArcGIS OAuth popup callback. When popup sign-in completes, ArcGIS redirects
      this popup here; we relay the response back to the app window and close.
      Kept dependency-free so it loads instantly.
    -->
    <script>
      (function () {
        try {
          var o = window.opener;
          if (o) {
            if (location.hash) {
              o.dispatchEvent(new CustomEvent("arcgis:auth:hash", { detail: location.hash }));
            } else if (location.search) {
              o.dispatchEvent(new CustomEvent("arcgis:auth:location:search", { detail: location.search }));
            }
          }
        } catch (e) {
          /* ignore */
        }
        window.close();
      })();
    </script>
  </body>
</html>
